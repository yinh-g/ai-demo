workflows:
  fitness-tracker-android:
    name: Fitness Tracker Android Build
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      node: 18
      npm_version: 10
      android_signing:
        - fitness_tracker_keystore
      groups:
        - expo
    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      - name: Clean and Install dependencies
        script: |
          rm -rf node_modules package-lock.json
          npm install
      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform android --clean
      - name: Build Android APK
        script: |
          cd android
          ./gradlew clean assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
