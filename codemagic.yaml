workflows:
  fitness-tracker-android:
    name: Fitness Tracker Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 18
      android_signing:
        - fitness_tracker_keystore
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform android
      - name: Build Android APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
